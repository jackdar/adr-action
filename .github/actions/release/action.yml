name: Tag and Release
description: Tags the branch and creates a new release

inputs:
  github-token:
    description: GitHub token for pushing and creating the release
    required: true
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          .nvmrc

    - name: Install Dependencies
      shell: bash
      run: npm ci

    - name: Read version
      id: version
      run: |
        VERSION="v$(node -p "require('./package.json').version")"
        MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

    - name: Check tag exists
      id: tag
      run: |
        if git ls-remote --tags origin "${{ steps.version.outputs.version }}" | grep -q .; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.tag.outputs.exists == 'false'
      run: npm ci && npm run build

    - name: Tag and release
      if: steps.tag.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        MAJOR="${{ steps.version.outputs.major }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git tag "$VERSION"
        git push origin "$VERSION"

        gh release create "$VERSION" \
          --title "$VERSION" \
          --generate-notes \
          dist/index.js

        git tag -f "$MAJOR"
        git push -f origin "$MAJOR"
