name: Tag and Release
description: Tags the branch and creates a new release on new version

inputs:
  github-token:
    description: GitHub token for pushing and creating the release
    required: true
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          .nvmrc

    - name: Install Dependencies and Build
      shell: bash
      run: npm ci && npm run build

    - name: Tag and release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        VERSION="v$(node -p "require('./package.json').version")"
        MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add dist/
        if ! git diff --staged --quiet; then
          git commit -m "chore: build $VERSION [skip ci]"
          git push origin HEAD:main
        fi

        git tag "$VERSION"
        git push origin "$VERSION"

        gh release create "$VERSION" \
          --title "$VERSION" \
          --generate-notes

        git tag -f "$MAJOR"
        git push -f origin "$MAJOR"
