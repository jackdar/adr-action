name: Tag and Release
description: Tags the branch and creates a new release

inputs:
  github-token:
    description: GitHub token for pushing and creating the release
    required: true
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          .nvmrc

    - name: Install Dependencies and Build
      shell: bash
      run: npm ci && npm run build

    - name: Read version
      id: version
      shell: bash
      run: |
        VERSION="v$(node -p "require('./package.json').version")"
        MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

    - name: Tag and release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        MAJOR="${{ steps.version.outputs.major }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add dist/
        if ! git diff --staged --quiet; then
          git commit -m "chore: build $VERSION [skip ci]"
          git push origin HEAD:main
        fi

        gh release create "$VERSION" \
          --title "$VERSION" \
          --generate-notes

        git tag -f "$MAJOR"
        git push -f origin "$MAJOR"
