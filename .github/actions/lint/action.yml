name: Lint
description: Installs dependencies and runs type checking and linting

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          .nvmrc

    - name: Install Dependencies
      shell: bash
      run: npm ci

    - name: Type Checking and Linting
      shell: bash
      run: npm run lint
