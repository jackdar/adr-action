on:
  pull_request:
    branches: [main]

jobs:
  version-bump:
    name: Check version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bumped
        run: |
          BASE_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          PR_VERSION=$(node -p "require('./package.json').version")

          echo "Base version (main): $BASE_VERSION"
          echo "PR version:          $PR_VERSION"

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "Error: package.json version has not been bumped (still $BASE_VERSION)."
            exit 1
          fi

          npx --yes semver "$PR_VERSION" > /dev/null 2>&1 || {
            echo "Error: '$PR_VERSION' is not a valid semver version."
            exit 1
          }

          if ! npx --yes semver -r ">$BASE_VERSION" "$PR_VERSION" > /dev/null 2>&1; then
            echo "Error: PR version ($PR_VERSION) must be greater than base version ($BASE_VERSION)."
            exit 1
          fi

          echo "Version bump valid: $BASE_VERSION -> $PR_VERSION"
