name: ADR Auto-Accept
description: Automatically sets the status of newly merged ADR files from Pending to Accepted

inputs:
  github-token:
    description: GitHub token for reading and committing ADR files
    required: true
    default: ${{ github.token }}
  adr-directory:
    description: Path to the ADR directory relative to the repo root
    required: false
    default: doc/adr

runs:
  using: node24
  main: dist/index.js
